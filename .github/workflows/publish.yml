# Publishes @notiflyio/sdk to npm with trusted publishing (OIDC) — no NPM_TOKEN secret.
#
# The trusted publisher registered for @notiflyio/sdk on npmjs.com must be EXACTLY:
#   Publisher:         GitHub Actions
#   Organization/user: DevinoSolutions
#   Repository:        notifly-node
#   Workflow filename: publish.yml
#   Environment:       (none)
# All fields are case-sensitive; renaming this file breaks publishing until the registration is
# updated. A mismatch surfaces as ENEEDAUTH / "Unable to authenticate" at the publish step.
#
# HOW TO RELEASE
#   Bump "version" in package.json on main, then publish a GitHub release whose tag is
#   v<version> (e.g. `gh release create v0.1.0 --repo DevinoSolutions/notifly-node`). The job
#   fails if the tag does not match package.json. workflow_dispatch publishes whatever version
#   the checked-out ref declares (npm rejects a version that already exists).
#
# runs-on is GitHub-hosted on purpose, NOT ubuntu-devino: npm trusted publishing does not support
# self-hosted runners ("self-hosted runners are not currently supported", docs.npmjs.com/trusted-publishers,
# read 2026-09-23), and this repo is public while the org's self-hosted runner group disallows
# public repositories.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: "22.22.1"
          registry-url: https://registry.npmjs.org

      - name: Install the pinned npm CLI (setup-node's bundled npm predates OIDC publishing)
        run: npm install -g npm@11.16.0 && npm --version

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::release tag ${TAG} does not match package.json version v${version}"
            exit 1
          fi

      - name: Install and run the smoke tests
        run: |
          npm ci
          npm test

      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public
